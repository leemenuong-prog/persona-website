<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alnt_med</title>
  <meta name="description" content="李文苑（Alnt Med）个人作品集：AI 产品与 AIGC 工作流（Pears · Co-work · 议见 · Meco · UABB 多模态），以及建筑作品。">
  <meta property="og:title" content="Alnt_med">
  <meta property="og:description" content="AI 产品与 AIGC 工作流，以及建筑作品集。">
  <meta property="og:image" content="assets/brand/favicon-512.png">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/brand/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon-180.png">
  <script>
    /* 防闪烁：提前落 locale（正式逻辑在 language-toggle.js） */
    try {
      var __l = localStorage.getItem('preferredLocale');
      if (__l !== 'zh' && __l !== 'en') __l = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
      document.documentElement.setAttribute('data-locale', __l);
      document.documentElement.lang = __l === 'zh' ? 'zh-CN' : 'en';
    } catch (e) {}
  </script>
  <link rel="preload" href="assets/fonts/monterey-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/barmorph.css">
  <link rel="stylesheet" href="css/loader.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body data-page="index">
  <!-- 启动页：每会话播一次（重播过则下方内联脚本立即拆除，零闪烁） -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="lkick">理性的艺术 · THE ART OF RATIONALITY</div>
    <div class="lreveal">
      <span class="lt g">I</span><span class="g">&nbsp;</span><span class="lt g">a</span><span class="ins ins1"><span class="lt">l</span><span class="lt">n</span><span class="lt">t</span></span><span class="tail t1"><span class="g">&nbsp;</span><span class="lt g">m</span><span class="ins ins2"><span class="lt">e</span><span class="lt">d</span></span><span class="tail t2"><span class="lsq"></span></span></span>
    </div>
    <div class="lbar"><i></i></div>
  </div>
  <script>
    try { if (sessionStorage.getItem('loaderPlayed') === '1' ||
              (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
      document.getElementById('loader').remove();
    } } catch (e) {}
  </script>
  <main>
    <!-- 英雄区：巨大名字居中 · 作品丝带环绕（前弧压字/后弧藏字后） · 左下 intro · 右下精选 -->
    <section class="hero" id="hero">
      <!-- 巨大名字：品牌图形，双语均显拉丁（中文身份由 aria-label + 左下 intro 承载） -->
      <h1 class="hero-name" aria-label="李文苑 · Wenyuan Li">
        <span class="hero-name-text">LI WENYUAN</span>
      </h1>

      <!-- 丝带舞台流内占位（buildSpine 锚此下缘；高度纯 CSS，勿依赖 JS/图片）；波点场装饰在其 ::before -->
      <div class="polygon-container" aria-hidden="true"></div>

      <!-- 3D 作品丝带：双容器 z-split 深度遮挡（back z1 → 大字 z2 → hit z3 → front z4 → foot z5）。
           卡片由 js/ribbon.js 生成并按世界深度在 back/front 间迁移；禁给两容器套共用 transform wrapper -->
      <div class="ribbon-layer ribbon-back" aria-hidden="true"><div class="ribbon-world"></div></div>
      <div class="ribbon-hit" aria-hidden="true"></div>
      <div class="ribbon-layer ribbon-front" aria-hidden="true"><div class="ribbon-world"></div></div>

      <!-- 贴底行：左 intro + 右精选 -->
      <div class="hero-foot">
        <div class="hero-intro">
          <p class="intro-kick">THE ART OF RATIONALITY</p>
          <p class="intro-title">
            <span data-zh="你好，我是 " data-en="HI, I AM ">你好，我是 </span>
            <span class="b" data-zh="李文苑" data-en="WENYUAN LI">李文苑</span>
            <span data-zh="。" data-en=".">。</span>
          </p>
          <p class="intro-sub">
            <span data-zh="我在做 " data-en="I make ">我在做 </span>
            <span class="k" data-zh="AI 产品" data-en="AI PRODUCTS">AI 产品</span>
            <span data-zh=" 与 " data-en=" and ">与</span>
            <span class="k" data-zh="AIGC 工作流" data-en="AIGC WORKFLOWS">AIGC 工作流</span>
            <span data-zh="；" data-en="; ">；</span>
            <span class="k" data-zh="建筑设计" data-en="ARCHITECTURE">建筑设计</span>
            <span class="l" data-zh="出身。" data-en=" by training.">出身。</span>
          </p>
        </div>
        <aside class="hero-aside">
          <p class="aside-kick" data-zh="精选 — SELECTED" data-en="SELECTED WORK">精选 — SELECTED</p>
          <a class="aside-item" href="project.html?id=pears"><span data-zh="Pears · AI 产品" data-en="Pears · AI Product">Pears · AI 产品</span><i class="asq"></i></a>
          <a class="aside-item" href="project.html?id=cowork"><span data-zh="Co-work · AIGC 工作流" data-en="Co-work · AIGC Workflow">Co-work · AIGC 工作流</span><i class="asq"></i></a>
        </aside>
      </div>
    </section>

    <!-- 中轴滚动线 + 珠（M2） -->
    <div class="line-container" id="line-container" aria-hidden="true"></div>

    <!-- AI 作品大卡 + 建筑网格（index.js 从 projects.json 渲染） -->
    <section class="projects-section">
      <div id="mainline" class="mainline"></div>
      <h2 class="epilogue-title" data-reveal>
        <span data-zh="建筑作品" data-en="ARCHITECTURE">建筑作品</span><span class="psq"></span>
      </h2>
      <div id="gallery" class="gallery-grid"></div>
    </section>

    <!-- 收尾：I am ___ 轮换，直接接页脚（波点带与 Logo 下坠已删，2026-07-07 用户裁定） -->
    <section class="finale" id="finale">
      <div class="iamf" data-reveal aria-live="polite">
        <span class="iamf-fixed">I am&nbsp;</span><span class="who" id="iamf-who">Alnt Med</span><i class="caret" aria-hidden="true"></i>
      </div>
    </section>
  </main>

  <script src="js/language-toggle.js" defer></script>
  <script src="js/barmorph.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/editor.js" defer></script>
  <script src="js/loader.js" defer></script>
  <script src="js/index-fx.js" defer></script>
  <script src="js/ribbon.js" defer></script>
  <script src="js/index.js" defer></script>
</body>
</html>
