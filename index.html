<!DOCTYPE html>

  <script>
    /* 防闪烁：提前落 locale（正式逻辑在 language-toggle.js） */
    try {
      var __l = localStorage.getItem('preferredLocale');
      if (__l !== 'zh' && __l !== 'en') __l = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
      document.documentElement.setAttribute('data-locale', __l);
      document.documentElement.lang = __l === 'zh' ? 'zh-CN' : 'en';
    } catch (e) {}
  </script>
  <link rel="preload" href="assets/fonts/monterey-regular.woff2" as="font" type="font/woff2" crossorigin>

  <main>
    <!-- 两行 intro：灰底色字 + 黑强调词 -->

      <h1 class="intro-line">
        <span class="g" data-zh="你好，我是 " data-en="HI, I AM ">你好，我是 </span>
        <span class="b" data-zh="李文苑" data-en="WENYUAN LI">李文苑</span>
        <span class="g" data-zh="。" data-en=".">。</span>
      </h1>
      <p class="intro-line">
        <span class="g" data-zh="我在做 " data-en="I make ">我在做 </span>

        <span class="g" data-zh=" 与 " data-en=" and ">与</span>

      <div id="mainline" class="mainline"></div>
      <h2 class="epilogue-title" data-reveal>
        <span data-zh="尾声 — 建筑作品" data-en="EPILOGUE — ARCHITECTURE">尾声 — 建筑作品</span><span class="psq"></span>
      </h2>
      <div id="gallery" class="gallery-grid"></div>
    </section>

  <script src="js/language-toggle.js" defer></script>
  <script src="js/barmorph.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/index-fx.js" defer></script>
