<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alnt_med</title>
  <meta name="description" content="李文苑（Alnt Med）个人作品集：AI 产品与 AIGC 工作流（Pears · Co-work · Yi-Jian · Meco · UABB 多模态），以及建筑作品。">
  <link rel="canonical" href="https://alnt-med.netlify.app/">
  <meta property="og:site_name" content="Alnt_med">
  <meta property="og:title" content="Alnt_med · 李文苑">
  <meta property="og:description" content="AI 产品与 AIGC 工作流，以及建筑作品集。">
  <meta property="og:url" content="https://alnt-med.netlify.app/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:image" content="https://alnt-med.netlify.app/assets/brand/share-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="李文苑 Alnt_med — 灰阶品牌条与名字">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/brand/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon-180.png">
  <script>
    /* 防闪烁：提前落 locale（正式逻辑在 language-toggle.js） */
    try {
      var __l = localStorage.getItem('preferredLocale');
      if (__l !== 'zh' && __l !== 'en') __l = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
      document.documentElement.setAttribute('data-locale', __l);
      document.documentElement.lang = __l === 'zh' ? 'zh-CN' : 'en';
    } catch (e) {}
  </script>
  <link rel="preload" href="assets/fonts/monterey-regular.woff2" as="font" type="font/woff2" crossorigin>
  <!-- 数据预取（2026-07-12 性能档）：作品卡+丝带几何全等 projects.json，提前到 HTML 解析期并行。
       crossorigin 必带——默认 fetch=cors+same-origin，preload 不带会凭据模式不匹配→双下载 -->
  <link rel="preload" href="config/projects.json" as="fetch" crossorigin>
  <!-- 丝带前 3 张卡图预载（2026-07-13 提速）：手机 .m.webp / 桌面 .webp 按 media 各取所需；
       id 必须与 projects.json sort_order 前三名一致（= ribbon.js i<3 的 fetchPriority=high 分支），
       tests/site-structure.test.mjs 有断言绑定 -->
  <link rel="preload" href="assets/ribbon/pears.m.webp" as="image" media="(max-width:767px)" fetchpriority="high">
  <link rel="preload" href="assets/ribbon/cowork.m.webp" as="image" media="(max-width:767px)" fetchpriority="high">
  <link rel="preload" href="assets/ribbon/yijian.m.webp" as="image" media="(max-width:767px)" fetchpriority="high">
  <link rel="preload" href="assets/ribbon/pears.webp" as="image" media="(min-width:768px)" fetchpriority="high">
  <link rel="preload" href="assets/ribbon/cowork.webp" as="image" media="(min-width:768px)" fetchpriority="high">
  <link rel="preload" href="assets/ribbon/yijian.webp" as="image" media="(min-width:768px)" fetchpriority="high">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/barmorph.css">
  <link rel="stylesheet" href="css/loader.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body data-page="index">
  <!-- 启动页：每会话播一次（重播过则下方内联脚本立即拆除，零闪烁） -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="lkick">理性的艺术 · THE ART OF RATIONALITY</div>
    <div class="lreveal">
      <span class="lt g">I</span><span class="g">&nbsp;</span><span class="lt g">a</span><span class="ins ins1"><span class="lt">l</span><span class="lt">n</span><span class="lt">t</span></span><span class="tail t1"><span class="g">&nbsp;</span><span class="lt g">m</span><span class="ins ins2"><span class="lt">e</span><span class="lt">d</span></span><span class="tail t2"><span class="lsq"></span></span></span>
    </div>
    <div class="lbar"><i></i></div>
  </div>
  <script>
    try { if (sessionStorage.getItem('loaderPlayed') === '1' ||
              (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
      document.getElementById('loader').remove();
    } } catch (e) {}
  </script>
  <main>
    <!-- 英雄区：巨大名字居中 · 作品丝带环绕（前弧压字/后弧藏字后） · 左下 intro · 右下精选 -->
    <section class="hero" id="hero">
      <!-- 巨大标题：品牌图形，双语均显拉丁（中文身份由 aria-label + 左下 intro 承载） -->
      <h1 class="hero-name" aria-label="李文苑 · Li-Wenyuan">
        <span class="hero-name-text">Li-Wenyuan</span>
      </h1>

      <!-- 丝带舞台流内占位（buildSpine 锚此下缘；高度纯 CSS，勿依赖 JS/图片）；波点场装饰在其 ::before -->
      <div class="polygon-container" aria-hidden="true"></div>

      <!-- 环的地面阴影（椭圆径向渐变，静态；位置/尺寸由 ribbon.js 随几何写一次，非逐帧） -->
      <div class="ribbon-floor" aria-hidden="true"></div>

      <!-- 3D 作品丝带：双容器 z-split 深度遮挡（back z1 → 大字 z2 → hit z3 → front z4 → foot z5）。
           连续带面画进前/后两张 canvas（js/ribbon-render.js），按世界深度分派前/后弧；
           禁给两容器套共用 transform wrapper（会挡掉大字的 z-index 夹层） -->
      <div class="ribbon-layer ribbon-back" aria-hidden="true"><canvas class="ribbon-canvas"></canvas></div>
      <div class="ribbon-hit" aria-hidden="true"></div>
      <div class="ribbon-layer ribbon-front" aria-hidden="true"><canvas class="ribbon-canvas"></canvas></div>

      <!-- 贴底行：左 intro + 右精选 -->
      <div class="hero-foot">
        <!-- 英雄页统一英文（2026-07-11 四迭代用户裁定）：不挂 data-zh/en，语言切换不影响本区 -->
        <div class="hero-intro">
          <p class="intro-kick">THE ART OF RATIONALITY</p>
          <p class="intro-title">HI, THIS IS MY <span class="b">PERSONAL WEBSITE</span>.</p>
        </div>
        <aside class="hero-aside">
          <p class="aside-kick">PORTFOLIOS</p>
          <a class="aside-item" href="portfolio/"><span>AI Product Portfolio</span><i class="asq"></i></a>
          <a class="aside-item" href="architecture.html"><span>Architecture Portfolio</span><i class="asq"></i></a>
        </aside>
      </div>
    </section>

    <!-- 中轴滚动线 + 珠（M2） -->
    <div class="line-container" id="line-container" aria-hidden="true"></div>

    <!-- AI 作品大卡 + 建筑网格（index.js 从 projects.json 渲染） -->
    <section class="projects-section">
      <div id="mainline" class="mainline"></div>
      <h2 class="epilogue-title" data-reveal>
        <span data-zh="建筑作品" data-en="ARCHITECTURE">建筑作品</span><span class="psq"></span>
      </h2>
      <div id="gallery" class="gallery-grid"></div>
    </section>

    <!-- 收尾：I am ___ 轮换，直接接页脚（波点带与 Logo 下坠已删，2026-07-07 用户裁定） -->
    <section class="finale" id="finale">
      <div class="iamf" data-reveal aria-live="polite">
        <span class="iamf-fixed">I am&nbsp;</span><span class="who" id="iamf-who">Alnt Med</span><i class="caret" aria-hidden="true"></i>
      </div>
    </section>
  </main>

  <script src="js/language-toggle.js" defer></script>
  <script src="js/img-util.js" defer></script>
  <script src="js/barmorph.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/editor.js" defer></script>
  <script src="js/loader.js" defer></script>
  <script src="js/index-fx.js" defer></script>
  <script src="js/ribbon-render.js" defer></script>
  <script src="js/ribbon.js" defer></script>
  <script src="js/index.js" defer></script>
</body>
</html>
