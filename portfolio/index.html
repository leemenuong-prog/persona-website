  <script>
    /* 无头打印用 ?lang=zh|en 显式覆盖（headless Chrome 全新 profile，navigator.language 不可控）；
       正常访问沿用 preferredLocale / 浏览器语言。language-toggle.js:23 会尊重这里预设的 data-locale。 */
    try {
      var __q = new URLSearchParams(location.search).get('lang');
      var __l = (__q === 'zh' || __q === 'en') ? __q : localStorage.getItem('preferredLocale');
      if (__l !== 'zh' && __l !== 'en') __l = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
      document.documentElement.setAttribute('data-locale', __l);
      document.documentElement.lang = __l === 'zh' ? 'zh-CN' : 'en';
    } catch (e) {}
  </script>
