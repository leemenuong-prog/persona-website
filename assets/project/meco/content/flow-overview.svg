<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img">
  <title>Meco 图版 05 · 一条消息的完整旅程 / Plate 05 · End-to-end flow</title>
  <style>
    line, rect, circle, path, polyline { vector-effect: non-scaling-stroke; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, 'Courier New', monospace; }
    .serif { font-family: Georgia, 'Times New Roman', 'Songti SC', 'STSong', 'Noto Serif SC', 'SimSun', serif; }
  </style>

  <rect x="0" y="0" width="1200" height="640" fill="#FFFBF0"/>
  <rect x="40" y="40" width="1120" height="560" fill="none" stroke="#E0E0E0" stroke-width="1"/>

  <text class="mono" x="80" y="102" font-size="22" letter-spacing="3" fill="#181818">PL. 05</text>
  <text class="mono" x="1120" y="102" font-size="20" letter-spacing="2" fill="#999999" text-anchor="end">OVERVIEW · 全景流程</text>
  <line x1="80" y1="126" x2="1120" y2="126" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 泳道标题 -->
  <text class="mono" x="200" y="170" font-size="17" letter-spacing="2" fill="#999999" text-anchor="middle">IN · 进</text>
  <text class="mono" x="600" y="170" font-size="17" letter-spacing="2" fill="#999999" text-anchor="middle">MECO · 单进程</text>
  <text class="mono" x="1000" y="170" font-size="17" letter-spacing="2" fill="#999999" text-anchor="middle">OUT · 出</text>

  <!-- 左：输入 -->
  <rect x="100" y="196" width="200" height="60" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1"/>
  <text class="serif" x="200" y="222" font-size="20" fill="#181818" text-anchor="middle">飞书消息</text>
  <text class="mono" x="200" y="242" font-size="14" letter-spacing="1" fill="#999999" text-anchor="middle">FEISHU DM</text>
  <rect x="100" y="286" width="200" height="60" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1"/>
  <text class="serif" x="200" y="312" font-size="20" fill="#181818" text-anchor="middle">桌面一句话</text>
  <text class="mono" x="200" y="332" font-size="14" letter-spacing="1" fill="#999999" text-anchor="middle">DESKTOP CHAT</text>
  <rect x="100" y="376" width="200" height="60" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1"/>
  <text class="serif" x="200" y="402" font-size="20" fill="#181818" text-anchor="middle">Claude Code</text>
  <text class="mono" x="200" y="422" font-size="14" letter-spacing="1" fill="#999999" text-anchor="middle">HTTP · 127.0.0.1</text>

  <line x1="300" y1="226" x2="380" y2="266" stroke="#BEBEBE" stroke-width="1"/>
  <line x1="300" y1="316" x2="380" y2="316" stroke="#BEBEBE" stroke-width="1"/>
  <line x1="300" y1="406" x2="380" y2="366" stroke="#BEBEBE" stroke-width="1"/>

  <!-- 中：单进程（四器官 + 大脑） -->
  <rect x="380" y="196" width="440" height="330" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5"/>
  <text class="mono" x="398" y="226" font-size="16" letter-spacing="2" fill="#6F6F6F">meco.py · 1 PROCESS</text>
  <rect x="402" y="244" width="92" height="52" fill="#FFFBF0" stroke="#BEBEBE" stroke-width="1"/>
  <text class="serif" x="448" y="268" font-size="17" fill="#181818" text-anchor="middle">机器人</text>
  <text class="mono" x="448" y="287" font-size="12" fill="#999999" text-anchor="middle">BOT</text>
  <rect x="506" y="244" width="92" height="52" fill="#FFFBF0" stroke="#BEBEBE" stroke-width="1"/>
  <text class="serif" x="552" y="268" font-size="17" fill="#181818" text-anchor="middle">接口</text>
  <text class="mono" x="552" y="287" font-size="12" fill="#999999" text-anchor="middle">44 API</text>
  <rect x="610" y="244" width="92" height="52" fill="#FFFBF0" stroke="#BEBEBE" stroke-width="1"/>
  <text class="serif" x="656" y="268" font-size="17" fill="#181818" text-anchor="middle">日程</text>
  <text class="mono" x="656" y="287" font-size="12" fill="#999999" text-anchor="middle">15s TICK</text>
  <rect x="714" y="244" width="92" height="52" fill="#FFFBF0" stroke="#BEBEBE" stroke-width="1"/>
  <text class="serif" x="760" y="268" font-size="17" fill="#181818" text-anchor="middle">窗口</text>
  <text class="mono" x="760" y="287" font-size="12" fill="#999999" text-anchor="middle">DESKTOP</text>

  <line x1="448" y1="296" x2="562" y2="388" stroke="#BEBEBE" stroke-width="1"/>
  <line x1="552" y1="296" x2="584" y2="374" stroke="#BEBEBE" stroke-width="1"/>
  <line x1="656" y1="296" x2="620" y2="374" stroke="#BEBEBE" stroke-width="1"/>
  <line x1="760" y1="296" x2="640" y2="388" stroke="#BEBEBE" stroke-width="1"/>

  <circle cx="600" cy="428" r="56" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5"/>
  <text class="serif" x="600" y="426" font-size="22" fill="#181818" text-anchor="middle">大脑</text>
  <text class="mono" x="600" y="450" font-size="14" letter-spacing="1" fill="#999999" text-anchor="middle">8 TOOLS</text>

  <!-- 右：输出（钴蓝点=到点提醒） -->
  <rect x="900" y="176" width="200" height="60" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1"/>
  <text class="serif" x="1000" y="202" font-size="20" fill="#181818" text-anchor="middle">Obsidian</text>
  <text class="mono" x="1000" y="222" font-size="14" letter-spacing="1" fill="#999999" text-anchor="middle">VAULT · SSOT</text>
  <rect x="900" y="266" width="200" height="60" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1"/>
  <text class="serif" x="1000" y="292" font-size="20" fill="#181818" text-anchor="middle">看板渲染</text>
  <text class="mono" x="1000" y="312" font-size="14" letter-spacing="1" fill="#999999" text-anchor="middle">FIVE BOARDS</text>
  <rect x="900" y="356" width="200" height="60" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1"/>
  <text class="serif" x="1000" y="382" font-size="20" fill="#181818" text-anchor="middle">数据落盘</text>
  <text class="mono" x="1000" y="402" font-size="14" letter-spacing="1" fill="#999999" text-anchor="middle">meco_data · ATOMIC</text>
  <rect x="900" y="446" width="200" height="60" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1"/>
  <text class="serif" x="1000" y="472" font-size="20" fill="#181818" text-anchor="middle">到点提醒</text>
  <text class="mono" x="1000" y="492" font-size="14" letter-spacing="1" fill="#999999" text-anchor="middle">PUSH · FEISHU</text>
  <rect x="888" y="470" width="12" height="12" fill="#0047AB"/>

  <!-- 右侧连线：Obsidian 只读进，其余出 -->
  <line x1="900" y1="206" x2="820" y2="246" stroke="#BEBEBE" stroke-width="1"/>
  <polyline points="830,242 820,246 828,254" fill="none" stroke="#BEBEBE" stroke-width="1"/>
  <text class="mono" x="866" y="196" font-size="13" letter-spacing="1" fill="#999999" text-anchor="end">READ-ONLY · 只读</text>
  <line x1="820" y1="296" x2="900" y2="296" stroke="#BEBEBE" stroke-width="1"/>
  <polyline points="890,290 900,296 890,302" fill="none" stroke="#BEBEBE" stroke-width="1"/>
  <line x1="820" y1="366" x2="900" y2="386" stroke="#BEBEBE" stroke-width="1"/>
  <polyline points="889,382 900,386 892,392" fill="none" stroke="#BEBEBE" stroke-width="1"/>
  <line x1="820" y1="436" x2="894" y2="472" stroke="#BEBEBE" stroke-width="1"/>
  <polyline points="884,468 894,472 886,478" fill="none" stroke="#BEBEBE" stroke-width="1"/>

  <text class="mono" x="600" y="566" font-size="20" letter-spacing="2" fill="#999999" text-anchor="middle">05 · ONE MESSAGE, END TO END / 一条消息的完整旅程</text>
</svg>
