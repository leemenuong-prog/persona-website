<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img">
  <title>Meco 图版 01 · 一个进程，四个器官 / Plate 01 · One Python process, four organs</title>
  <style>
    line, rect, circle, path, polyline { vector-effect: non-scaling-stroke; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, 'Courier New', monospace; }
    .serif { font-family: Georgia, 'Times New Roman', 'Songti SC', 'STSong', 'Noto Serif SC', 'SimSun', serif; }
  </style>

  <!-- 纸底 + 发丝外框 -->
  <rect x="0" y="0" width="1200" height="750" fill="#FFFBF0"/>
  <rect x="40" y="40" width="1120" height="670" fill="none" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 页眉：图版编号 + 双语 kicker -->
  <text class="mono" x="80" y="102" font-size="22" letter-spacing="3" fill="#181818">PL. 01</text>
  <text class="mono" x="1120" y="102" font-size="20" letter-spacing="2" fill="#999999" text-anchor="end">SINGLE PROCESS · 单进程</text>
  <line x1="80" y1="126" x2="1120" y2="126" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 主体：一个 Python 进程 -->
  <g transform="translate(0,24)">
  <rect x="180" y="200" width="880" height="330" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5"/>
  <text class="mono" x="200" y="238" font-size="20" letter-spacing="2" fill="#6F6F6F">meco.py · 1 PYTHON PROCESS</text>

  <!-- 入口：双击即用（全图唯一钴蓝点） -->
  <line x1="70" y1="365" x2="172" y2="365" stroke="#6F6F6F" stroke-width="1.5"/>
  <text class="mono" x="120" y="346" font-size="20" letter-spacing="1" fill="#999999" text-anchor="middle">OPEN · 双击</text>
  <rect x="174" y="359" width="12" height="12" fill="#0047AB"/>

  <!-- 舱间细管线 -->
  <line x1="397" y1="365" x2="419" y2="365" stroke="#BEBEBE" stroke-width="1"/>
  <line x1="609" y1="365" x2="631" y2="365" stroke="#BEBEBE" stroke-width="1"/>
  <line x1="821" y1="365" x2="843" y2="365" stroke="#BEBEBE" stroke-width="1"/>

  <!-- 舱 1 · 飞书机器人 -->
  <rect x="207" y="260" width="190" height="210" fill="#FFFBF0" stroke="#BEBEBE" stroke-width="1"/>
  <text class="mono" x="219" y="284" font-size="16" fill="#BEBEBE">a</text>
  <rect x="272" y="298" width="60" height="44" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5"/>
  <polyline points="290,342 284,356 306,342" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5"/>
  <circle cx="292" cy="320" r="2.5" fill="#6F6F6F"/>
  <circle cx="302" cy="320" r="2.5" fill="#6F6F6F"/>
  <circle cx="312" cy="320" r="2.5" fill="#6F6F6F"/>
  <text class="serif" x="302" y="420" font-size="24" fill="#181818" text-anchor="middle">飞书机器人</text>
  <text class="mono" x="302" y="448" font-size="18" letter-spacing="1" fill="#999999" text-anchor="middle">FEISHU BOT</text>

  <!-- 舱 2 · 44 个本地接口 -->
  <rect x="419" y="260" width="190" height="210" fill="#FFFBF0" stroke="#BEBEBE" stroke-width="1"/>
  <text class="mono" x="431" y="284" font-size="16" fill="#BEBEBE">b</text>
  <text class="serif" x="514" y="362" font-size="76" fill="#181818" text-anchor="middle">44</text>
  <text class="serif" x="514" y="420" font-size="24" fill="#181818" text-anchor="middle">本地接口</text>
  <text class="mono" x="514" y="448" font-size="18" letter-spacing="1" fill="#999999" text-anchor="middle">LOCAL APIs</text>

  <!-- 舱 3 · 日程引擎 -->
  <rect x="631" y="260" width="190" height="210" fill="#FFFBF0" stroke="#BEBEBE" stroke-width="1"/>
  <text class="mono" x="643" y="284" font-size="16" fill="#BEBEBE">c</text>
  <circle cx="726" cy="326" r="32" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5"/>
  <line x1="726" y1="326" x2="726" y2="304" stroke="#6F6F6F" stroke-width="1.5"/>
  <line x1="726" y1="326" x2="742" y2="336" stroke="#6F6F6F" stroke-width="1.5"/>
  <text class="serif" x="726" y="420" font-size="24" fill="#181818" text-anchor="middle">日程引擎</text>
  <text class="mono" x="726" y="448" font-size="18" letter-spacing="1" fill="#999999" text-anchor="middle">TICK 15s</text>

  <!-- 舱 4 · 桌面窗口 -->
  <rect x="843" y="260" width="190" height="210" fill="#FFFBF0" stroke="#BEBEBE" stroke-width="1"/>
  <text class="mono" x="855" y="284" font-size="16" fill="#BEBEBE">d</text>
  <rect x="906" y="298" width="64" height="48" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5"/>
  <line x1="906" y1="312" x2="970" y2="312" stroke="#6F6F6F" stroke-width="1.5"/>
  <circle cx="914" cy="305" r="2" fill="#6F6F6F"/>
  <circle cx="922" cy="305" r="2" fill="#6F6F6F"/>
  <text class="serif" x="938" y="420" font-size="24" fill="#181818" text-anchor="middle">桌面窗口</text>
  <text class="mono" x="938" y="448" font-size="18" letter-spacing="1" fill="#999999" text-anchor="middle">DESKTOP</text>

  </g>

  <!-- 版内图注 -->
  <text class="mono" x="600" y="674" font-size="20" letter-spacing="2" fill="#999999" text-anchor="middle">01 · ONE PROCESS, FOUR ORGANS / 一个进程，四个器官</text>
</svg>
