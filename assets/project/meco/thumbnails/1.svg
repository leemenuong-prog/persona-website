<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720" role="img" aria-label="Meco — 蘑菇管家 · Personal Agent">
  <style>
    line, rect, circle, path, polyline { vector-effect: non-scaling-stroke; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, 'Courier New', monospace; }
    .serif { font-family: Georgia, 'Times New Roman', 'Songti SC', 'STSong', 'Noto Serif SC', 'SimSun', serif; }
  </style>

  <rect x="0" y="0" width="720" height="720" fill="#FFFBF0"/>
  <rect x="30" y="30" width="660" height="660" fill="none" stroke="#E0E0E0" stroke-width="1"/>

  <text class="mono" x="62" y="90" font-size="18" letter-spacing="3" fill="#181818">PL. 00</text>
  <text class="mono" x="658" y="90" font-size="15" letter-spacing="2" fill="#999999" text-anchor="end">MECO · 蘑菇管家</text>
  <line x1="62" y1="112" x2="658" y2="112" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 蘑菇：伞盖（发丝线穹顶）罩住单进程（菌柄即进程） -->
  <path d="M 180 372 A 180 148 0 0 1 540 372 Z" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5"/>
  <path d="M 232 306 A 152 118 0 0 1 360 254" fill="none" stroke="#BEBEBE" stroke-width="1"/>
  <circle cx="286" cy="322" r="9" fill="none" stroke="#BEBEBE" stroke-width="1"/>
  <circle cx="368" cy="284" r="7" fill="none" stroke="#BEBEBE" stroke-width="1"/>
  <circle cx="446" cy="326" r="8" fill="none" stroke="#BEBEBE" stroke-width="1"/>

  <rect x="318" y="372" width="84" height="102" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5"/>
  <text class="mono" x="360" y="416" font-size="15" letter-spacing="1" fill="#6F6F6F" text-anchor="middle">meco.py</text>
  <text class="mono" x="360" y="440" font-size="12" letter-spacing="1" fill="#999999" text-anchor="middle">1 PROCESS</text>
  <line x1="240" y1="474" x2="480" y2="474" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 字标：黑方块句点（明度跳，随全站灰阶口径） -->
  <text class="serif" x="348" y="566" font-size="76" letter-spacing="10" fill="#181818" text-anchor="middle">MECO</text>
  <rect x="506" y="550" width="14" height="14" fill="#000000"/>
  <text class="mono" x="360" y="612" font-size="17" letter-spacing="3" fill="#999999" text-anchor="middle">PERSONAL AGENT · 个人管家</text>
</svg>
